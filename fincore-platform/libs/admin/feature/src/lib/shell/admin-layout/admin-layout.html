<mat-sidenav-container class="admin-shell">
  <mat-sidenav class="sidebar" mode="side" opened>
    <a class="brand" routerLink="/admin/dashboard">
      <span class="brand-logo">F</span>
      <span class="brand-text">
        <strong>FinCore</strong>
        <small>PLATFORM ADMIN</small>
      </span>
    </a>

    <div class="nav-section-title">WORKSPACE</div>

    <nav class="navigation">
      <a
        mat-flat-button
        [routerLink]="'/admin/dashboard'"
        [routerLinkActive]="'active'"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <mat-icon>space_dashboard</mat-icon>
        <span>Dashboard</span>
      </a>

      <a
        mat-button
        routerLink="/admin/onboarding"
        routerLinkActive="active"
      >
        <mat-icon>how_to_reg</mat-icon>
        <span>Onboarding</span>
      </a>

      <a
        mat-button
        routerLink="/admin/organizations"
        routerLinkActive="active"
      >
        <mat-icon>business</mat-icon>
        <span>Organizations</span>
      </a>

      <a
        mat-button
        routerLink="/admin/audit"
        routerLinkActive="active"
      >
        <mat-icon>manage_search</mat-icon>
        <span>Audit log</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="security-card">
        <mat-icon>verified_user</mat-icon>

        <div>
          <strong>Platform security</strong>
          <small>Privileged workspace</small>
        </div>

        <span class="online-indicator"></span>
      </div>

      <div class="profile">
        <div class="avatar">MA</div>

        <div>
          <strong>Platform Admin</strong>
          <small>FinCore operations</small>
        </div>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <mat-toolbar class="topbar">
      <div class="breadcrumb">
        <span>FinCore</span>
        <mat-icon>chevron_right</mat-icon>
        <strong>Platform Admin</strong>
      </div>

      <span class="toolbar-spacer"></span>

      <span class="environment">
        <span class="online-indicator"></span>
        PLATFORM
      </span>

      <button mat-icon-button aria-label="Notifications">
        <mat-icon>notifications_none</mat-icon>
      </button>

      <button mat-icon-button aria-label="Account menu">
        <mat-icon>account_circle</mat-icon>
      </button>
    </mat-toolbar>

    <main class="page-container">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
