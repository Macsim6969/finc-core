<div class="custom-select">
  <button
    type="button"
    class="custom-select__trigger"
    [class.custom-select__trigger--open]="opened()"
    [class.custom-select__trigger--disabled]="disabled()"
    [disabled]="disabled()"
    (click)="toggle($event)"
  >
    <span
      [class.custom-select__placeholder]="!selectedOption"
    >
      @if (selectedOption; as option) {
        @if (translateOptions()) {
          {{ option.label | translate }}
        } @else {
          {{ option.label }}
        }
      } @else {
        {{ placeholder() | translate }}
      }
    </span>

    <span class="custom-select__arrow"></span>
  </button>

  @if (opened()) {
    <div
      class="custom-select__dropdown"
      (click)="$event.stopPropagation()"
    >
      @for (
        option of options();
        track option.value
        ) {
        <button
          type="button"
          class="custom-select__option"
          [class.custom-select__option--selected]="
            isSelected(option)
          "
          [class.custom-select__option--disabled]="
            option.disabled
          "
          [disabled]="option.disabled"
          (click)="selectOption(option, $event)"
        >
          <span>
            @if (translateOptions()) {
              {{ option.label | translate }}
            } @else {
              {{ option.label }}
            }
          </span>

          @if (isSelected(option)) {
            <span class="custom-select__check">
              ✓
            </span>
          }
        </button>
      }
    </div>
  }
</div>
